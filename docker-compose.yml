# TCL KOL OS — entorno de desarrollo local
#
# Levanta el sistema completo: web, worker, base de datos y cola.
# ADR-001: monolito modular, sin Kubernetes ni red de microservicios.
#
#   docker compose up
#
# Requisitos: Docker Desktop instalado (ver README §Requisitos).

name: tcl-kol-os

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tclkolos-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tclkolos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-tclkolos}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tclkolos} -d ${POSTGRES_DB:-tclkolos}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tclkolos-redis
    # ADR-007: Redis no conserva estado de negocio. Perderlo cuesta trabajo
    # encolado, nunca información. Por eso no se monta volumen.
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ./services/ai-worker
      dockerfile: Dockerfile
    container_name: tclkolos-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tclkolos}:${POSTGRES_PASSWORD:-devpassword}@db:5432/${POSTGRES_DB:-tclkolos}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-}
      # El worker es el único que llama al proveedor (D0-09 §3), así que es el
      # único que recibe la clave. La web nunca la ve.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_APP_URL: ${AI_APP_URL:-}
      AI_MODEL_EFICIENTE: ${AI_MODEL_EFICIENTE:-}
      AI_MODEL_EQUILIBRADO: ${AI_MODEL_EQUILIBRADO:-}
      AI_MODEL_AVANZADO: ${AI_MODEL_AVANZADO:-}
      AI_MODEL_EMBEDDINGS: ${AI_MODEL_EMBEDDINGS:-}
      # El esquema del brief vive en docs/ (D0-05) y se monta abajo.
      BRIEF_SCHEMA_PATH: /esquema/brief.schema.json
      # Catálogo único de campos (criticidad, nivel — Sprint 4, corrección 4
      # del cierre). Mismo directorio montado, mismo mecanismo que el esquema.
      BRIEF_CATALOG_PATH: /esquema/brief-catalog.json
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - '${WORKER_PORT:-8000}:8000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/ai-worker:/app
      # Solo lectura: el worker consulta el esquema, nunca lo edita.
      - ./docs/product/brief-schema:/esquema:ro
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Consumidor de la cola documental.
  #
  # Va aparte del servicio `worker` porque son dos procesos distintos: aquel
  # atiende HTTP, este consume `processing_jobs` en bucle. Comparten imagen a
  # propósito —los parsers de PPTX y DOCX viven ahí—, y esa es justamente la
  # razón de que exista este servicio: correr el consumidor fuera del
  # contenedor, con un intérprete que no tiene esas librerías, marca los
  # documentos como fallidos sin que el código tenga nada malo.
  consumidor:
    # Reutiliza la imagen que construye `worker`: es el mismo código y las
    # mismas dependencias, solo cambia el proceso que arranca. Construirla dos
    # veces solo duplicaría el tiempo de arranque y el riesgo de que las dos
    # copias se desincronicen.
    image: tcl-kol-os-worker:latest
    container_name: tclkolos-consumidor
    command: ['python', 'worker.py', '--intervalo', '2']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tclkolos}:${POSTGRES_PASSWORD:-devpassword}@db:5432/${POSTGRES_DB:-tclkolos}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_APP_URL: ${AI_APP_URL:-}
      AI_MODEL_EFICIENTE: ${AI_MODEL_EFICIENTE:-}
      AI_MODEL_EQUILIBRADO: ${AI_MODEL_EQUILIBRADO:-}
      AI_MODEL_EMBEDDINGS: ${AI_MODEL_EMBEDDINGS:-}
      BRIEF_SCHEMA_PATH: /esquema/brief.schema.json
      BRIEF_CATALOG_PATH: /esquema/brief-catalog.json
      # Los originales que guardó la web. Sin esto el consumidor arranca bien y
      # falla en cada job con «no se pudo leer el archivo».
      STORAGE_LOCAL_PATH: /almacen
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./services/ai-worker:/app
      - ./docs/product/brief-schema:/esquema:ro
      - ./.storage:/almacen
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: tclkolos-web
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tclkolos}:${POSTGRES_PASSWORD:-devpassword}@db:5432/${POSTGRES_DB:-tclkolos}
      REDIS_URL: redis://redis:6379/0
      WORKER_URL: http://worker:8000
      NODE_ENV: ${NODE_ENV:-development}
      AI_ENABLED: ${AI_ENABLED:-false}
      # V2 · Fase 6 — chat del agente de Cuenta. La web orquesta el bucle y las tools, pero NO
      # llama al proveedor ni recibe su clave: cada vuelta de modelo es un POST a
      # `WORKER_URL/modelo/turno`. Estas variables solo registran con qué configuración se
      # admite el turno, fijan los límites del run y firman el nonce de los sobres (ver
      # `.env.example`). Vacías = el runtime usa sus valores por defecto.
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL_EQUILIBRADO: ${AI_MODEL_EQUILIBRADO:-}
      AGENT_NONCE_SECRET: ${AGENT_NONCE_SECRET:-}
      AGENT_MAX_TOOL_STEPS: ${AGENT_MAX_TOOL_STEPS:-}
      AGENT_RUN_DEADLINE_S: ${AGENT_RUN_DEADLINE_S:-}
      AGENT_MODEL_TIMEOUT_S: ${AGENT_MODEL_TIMEOUT_S:-}
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-}
      # Adjuntos del chat (ruta HTTP, no server action: Next limita estas a 1 MB).
      CHAT_ATTACHMENT_MAX_MB: ${CHAT_ATTACHMENT_MAX_MB:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      # `packages/domain/src/brief-catalog.ts` necesita el mismo catálogo que
      # lee el worker (Sprint 4, corrección 4 del cierre) — sin este montaje,
      # el contenedor `web` no tenía `docs/` en absoluto.
      BRIEF_CATALOG_PATH: /repo/docs/product/brief-schema/brief-catalog.json
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
      worker:
        condition: service_started
    volumes:
      - ./apps/web:/repo/apps/web
      - ./packages:/repo/packages
      - ./docs/product/brief-schema:/repo/docs/product/brief-schema:ro
      - /repo/apps/web/.next
      - /repo/node_modules

volumes:
  db-data:
