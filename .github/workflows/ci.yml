name: CI

# Épica E1-7: un PR con una prueba rota no se puede fusionar.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Dominio y web
    runs-on: ubuntu-latest
    # `packages/db` corre contra Postgres real (nunca contra mocks — sección
    # de pruebas del cierre de Sprint 4). Antes de este servicio, el paso
    # "Pruebas del dominio" ejecutaba `packages/db` sin base de datos
    # disponible: el candado de INC-001A lo hacía fallar en cada corrida.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tclkolos
          POSTGRES_PASSWORD: devpassword
          # Se nombra _test desde el arranque: packages/db/vitest.setup.ts
          # (INC-001A) exige ese sufijo y nunca cae de vuelta a otra base.
          POSTGRES_DB: tclkolos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tclkolos -d tclkolos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # `pipeline.test.ts` y `end-to-end.test.ts` necesitan un worker real
      # (nunca uno simulado en el código de prueba) procesando la cola real
      # — Redis es la cola de trabajo del worker (ADR-009 la deja solo para
      # trabajo en tránsito, nunca estado de negocio, así que perderla entre
      # corridas no arriesga nada).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `packages/db`'s migrate/seed corren con `--experimental-strip-types`
          # (Node 22.6+). El 20 fijado antes nunca lo habría soportado.
          node-version: '22'
          cache: npm

      - run: npm ci

      # Incluye la regla de frontera de ADR-008.
      - name: Lint
        run: npm run lint

      - name: Typecheck (modo estricto)
        run: npm run typecheck

      # El servicio arranca la base vacía, sin las extensiones que
      # infra/db/init/01-extensions.sql aplica normalmente vía
      # docker-entrypoint-initdb.d (docker-compose.yml). Se replican aquí.
      - name: Preparar extensiones de Postgres
        env:
          PGPASSWORD: devpassword
        run: psql -h localhost -U tclkolos -d tclkolos_test -f infra/db/init/01-extensions.sql

      # pipeline.test.ts (Sprint 2) necesita la campaña y el usuario del seed
      # incluso cuando su rama de PPT real se omite por falta de material.
      - name: Migrar y sembrar la base de pruebas (INC-001A)
        env:
          DATABASE_URL: postgresql://tclkolos:devpassword@localhost:5432/tclkolos_test
        run: |
          npm run migrate --workspace @tcl-kol-os/db
          npm run seed --workspace @tcl-kol-os/db

      # Worker real (HTTP + consumidor), con AI_PROVIDER=fake — determinístico,
      # sin red, sin costo, sin depender de ninguna clave (corrección posterior
      # al checkpoint 516de31: la suite automatizada nunca necesita una clave
      # real de OpenRouter). Habilita en CI las mismas pruebas que antes solo
      # corrían completas en local con un worker levantado a mano:
      # `pipeline.test.ts` (parseo real de un PPTX, cola real) y
      # `end-to-end.test.ts` (recorrido HTTP real con el proveedor falso).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/ai-worker/requirements.txt

      - name: Instalar dependencias del worker
        working-directory: services/ai-worker
        run: pip install -r requirements.txt

      - name: Levantar worker + consumidor (AI_PROVIDER=fake)
        working-directory: services/ai-worker
        env:
          DATABASE_URL: postgresql://tclkolos:devpassword@localhost:5432/tclkolos_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: development
          AI_ENABLED: 'true'
          AI_PROVIDER: fake
          AI_MODEL_EFICIENTE: google/gemini-2.5-flash-lite
          AI_MODEL_EQUILIBRADO: anthropic/claude-haiku-4.5
          AI_MODEL_AVANZADO: anthropic/claude-sonnet-5
          AI_MODEL_EMBEDDINGS: openai/text-embedding-3-small
          AI_APP_URL: https://smartpr.co
          BRIEF_SCHEMA_PATH: ${{ github.workspace }}/docs/product/brief-schema/brief.schema.json
          BRIEF_CATALOG_PATH: ${{ github.workspace }}/docs/product/brief-schema/brief-catalog.json
          STORAGE_LOCAL_PATH: ${{ github.workspace }}/.storage
          LOG_LEVEL: INFO
        run: |
          mkdir -p "$STORAGE_LOCAL_PATH"
          PYTHONPATH=. nohup .venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 \
            > /tmp/worker-http.log 2>&1 &
          PYTHONPATH=. nohup python worker.py --intervalo 2 > /tmp/worker-consumidor.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ready > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/ready || (cat /tmp/worker-http.log; exit 1)

      # E13-1, E13-2, E13-3: transiciones, aislamiento e inmutabilidad.
      # Estas pruebas bloquean el merge sin excepción (D0-12 §8).
      - name: Pruebas del dominio
        env:
          TEST_DATABASE_URL: postgresql://tclkolos:devpassword@localhost:5432/tclkolos_test
          AI_WORKER_URL: http://localhost:8000
        run: npm test

      - name: Logs del worker (si algo falló arriba)
        if: failure()
        run: |
          echo "--- worker HTTP ---"; cat /tmp/worker-http.log || true
          echo "--- consumidor ---"; cat /tmp/worker-consumidor.log || true

      - name: Build
        run: npm run build

      - name: Formato
        run: npm run format:check

  worker:
    name: Worker Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/ai-worker/requirements.txt

      - run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy app

      - name: Pruebas
        run: PYTHONPATH=. pytest tests/ -q

      # Corrección 4 del cierre de Sprint 4: TS y Python deben leer
      # exactamente el mismo docs/product/brief-schema/brief-catalog.json.
      # Sin dependencias de node_modules — no hace falta `npm ci` aquí.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Catálogo único (TS y Python coinciden)
        working-directory: ${{ github.workspace }}
        run: node --experimental-strip-types scripts/verificar-catalogo.mjs

  security:
    name: Dependencias y secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # E1-8: escaneo de dependencias.
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
        continue-on-error: true

      # §12.1, control 5: ninguna credencial en el repositorio.
      - name: Verificar que .env no está versionado
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env está versionado. Debe estar en .gitignore."
            exit 1
          fi
          echo "OK: .env no está versionado."
