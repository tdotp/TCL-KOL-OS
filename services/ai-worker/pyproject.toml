[project]
name = "tcl-kol-os-ai-worker"
version = "0.1.0"
description = "Worker documental e IA de TCL KOL OS"
# El contenedor usa 3.11; el piso es 3.9 para poder correr las pruebas del
# dominio del worker sin Docker en máquinas con el Python del sistema.
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_explicit = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "RET", "SIM"]
ignore = ["S101"]  # assert está permitido en pruebas

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # credenciales ficticias en fixtures
